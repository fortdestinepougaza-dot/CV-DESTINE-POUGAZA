<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partager ma localisation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📍 Partager ma localisation</h1>

    <p>
      Cette page demande l'autorisation d'accéder à votre position GPS.
    </p>

    <button onclick="startLocation()">
      Autoriser ma localisation
    </button>

    <div id="status"></div>

  </div>

  <script>

    let watchID;

    function startLocation() {

      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML =
          "❌ La géolocalisation n'est pas disponible.";
        return;
      }

      status.innerHTML =
        "⏳ Demande d'autorisation...";

      watchID = navigator.geolocation.watchPosition(

        function(position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          status.innerHTML =
            "✅ Localisation activée<br><br>" +
            "Latitude : " + latitude + "<br>" +
            "Longitude : " + longitude + "<br>" +
            "Précision : environ " + Math.round(accuracy) + " m";

        },

        function(error) {

          if (error.code === 1) {
            status.innerHTML =
              "❌ Vous avez refusé l'accès à la localisation.";
          } else {
            status.innerHTML =
              "❌ Impossible d'obtenir la localisation.";
          }

        },

        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }

      );
    }

  </script>

</body>
</html>
